<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Online</title>
    <link rel="stylesheet" href="cafe.css">
</head>
<body>

    <div class="chat-container">
        <h1>Sala de Chat</h1>

        <!-- Áreas das mensagens divididas em duas listas -->
        <div class="messages-area">
            <div class="list-container">
                <h2>Outros</h2>
                <ul id="others-messages">
                    <li>Olá! Tudo bem?</li>
                </ul>
            </div>

            <div class="list-container">
                <h2>Você</h2>
                <ul id="user-messages">
                    <!-- Mensagens do usuário aparecerão aqui -->
                </ul>
            </div>
        </div>

        <!-- Campo de texto e botão posicionados embaixo das listas -->
        <div class="input-area">
            <input type="text" id="message-input" placeholder="Digite sua mensagem...">
            <button id="send-btn">Enviar</button>
        </div>
    </div>

    <!-- Script embutido diretamente no HTML -->
    <script>
        const sendBtn = document.getElementById('send-btn');
        const messageInput = document.getElementById('message-input');
        const userMessagesList = document.getElementById('user-messages');

        function sendMessage() {
            const messageText = messageInput.value.trim();

            if (messageText !== '') {
                const newLi = document.createElement('li');
                newLi.textContent = messageText;
                userMessagesList.appendChild(newLi);
                messageInput.value = '';
                messageInput.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);

        messageInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
